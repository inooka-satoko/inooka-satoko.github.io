<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>お問い合わせ | 井ノ岡里子</title>
    <link rel="icon" href="../file/icon.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <h1 class="site-title">
                <a href="../index.html">
                    <span class="main-name">井ノ岡里子</span>
                    <span class="sub-title">日本画家 / 庭style主宰</span>
                </a>
            </h1>
            <nav class="site-nav">
                <ul>
                    <li><a href="../profile/index.html"><span class="en">Profile</span><span class="ja">プロフィール</span></a></li>
                    <li><a href="../news/index.html"><span class="en">News</span><span class="ja">ニュース</span></a></li>
                    <li><a href="index.html"><span class="en">Contact</span><span class="ja">コンタクト</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="page-header">
        <h1 class="page-title">Contact</h1>
        <p class="page-subtitle">お問い合わせ</p>
    </div>

    <section class="section pt-0">
        <div class="container">
            <p class="text-center mb-4">作品や展示に関するお問い合わせは、以下のフォームよりお願いいたします。</p>
            
            <div class="contact-form">
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="name">お名前</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">お問い合わせ内容</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <div class="text-center mt-4">
                        <button type="submit" class="btn">送信する</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container text-center">
            <p class="footer-title">【公式】井ノ岡里子｜日本画家／庭style主宰</p>
            <ul class="footer-links">
                <li><a href="#">プライバシーポリシー</a></li>
            </ul>
            <p class="copyright">&copy; Satoko Inooka All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
